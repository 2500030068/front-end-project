<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Seller Dashboard</title><link rel="stylesheet" href="style.css">
</head>
<body class="terminal-body">
    <div class="terminal-header">
        <div><strong style="color: white;">SELLER LISTING PORTAL</strong></div>
        <div><span id="userName" style="color: #a855f7; margin-right: 15px;"></span><button onclick="logout()">EXIT</button></div>
    </div>

    <div style="padding: 40px; max-width: 600px; margin: 0 auto;">
        <div class="panel" style="background: #18181b; border: 1px solid #27272a; color: white;">
            <h3 style="margin-bottom: 20px; color: #a855f7;">Create New Auction</h3>
            
            <label style="font-size: 12px; color: #a3a3a3;">Asset Title</label>
            <input type="text" id="title" placeholder="e.g. 2018 Honda Civic" style="background: #09090b; color: white; border: 1px solid #27272a;">
            
            <label style="font-size: 12px; color: #a3a3a3;">Category</label>
            <select id="cat" style="background: #09090b; color: white; border: 1px solid #27272a;">
                <option value="bank">Bank Foreclosure</option>
                <option value="real_estate">Real Estate</option>
                <option value="vehicles">Vehicles</option>
                <option value="electronics">Electronics</option>
            </select>
            
            <label style="font-size: 12px; color: #a3a3a3;">Base Price (₹)</label>
            <input type="number" id="price" placeholder="Base Price" style="background: #09090b; color: white; border: 1px solid #27272a;">
            
            <label style="font-size: 12px; color: #a3a3a3;">Duration (Minutes)</label>
            <input type="number" id="time" placeholder="e.g. 15" style="background: #09090b; color: white; border: 1px solid #27272a;">
            
            <button onclick="listAsset()" style="background: #a855f7; border: none; color: white; margin-top: 15px;">PUBLISH TO MARKET</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const user = checkAuth('seller');
        document.getElementById('userName').innerText = `SELLER: ${user.name.toUpperCase()}`;

        function listAsset() {
            const title = document.getElementById('title').value;
            const cat = document.getElementById('cat').value;
            const price = Number(document.getElementById('price').value);
            const time = Number(document.getElementById('time').value);

            let auctions = JSON.parse(localStorage.getItem('auctions_v3'));
            auctions.push({
                id: cat.substring(0,3).toUpperCase() + "-" + Math.floor(1000 + Math.random() * 9000),
                category: cat, title: title, seller: user.name,
                basePrice: price, endTime: Date.now() + (time * 60 * 1000),
                bids: [{ bidder: "System", amount: price }]
            });
            localStorage.setItem('auctions_v3', JSON.stringify(auctions));
            alert("Asset Published Successfully!");
        }
    </script>
</body>
</html>
